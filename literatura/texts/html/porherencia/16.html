<body>
    <div class="main">
        <h2>16</h2>
        <p>
            Un día, heredé las montañas. Me gustaría decírselo así a mi padre, que supiera que he aceptado ser parte de
            su
            dinastía.
        </p>
        <p>
            No se puede legar aquello que no se posee. Eso quiere decir que mi padre fue dueño de las montañas, las hizo
            suyas, le pertenecieron. Me hace feliz pensarlo.
        </p>
    </div>
